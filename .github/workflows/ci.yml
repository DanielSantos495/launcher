name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lectura del repositorio: ningún trabajo necesita escribir ni usar otros permisos.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Corepack descarga el pnpm fijado en `packageManager` sin preguntar.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  host:
    name: Host en Go
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native-host/go.mod
          cache: false
      # El host solo se instala y se prueba en macOS: su comprobación del proceso padre (lsof) y sus rutas son de macOS.
      - run: go vet ./... && go test ./...
        working-directory: native-host

  e2e:
    name: E2E con Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Solo el Chromium de Playwright, con las librerías del sistema que necesita. El modo headless nuevo carga
      # extensiones sin pantalla, así que no hace falta xvfb.
      - run: pnpm -C apps/extension exec playwright install --with-deps chromium
      - run: pnpm e2e
